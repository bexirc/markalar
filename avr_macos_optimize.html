<title>avr. Alışveriş Rehberi</title>
<style>
:root{--accent:#0FA3B8;--accent-text:#0FA3B8;--bg:#F2F2F7;--card:#FFFFFF;--fg:#000000;--mut:#6C6C70;--sep:#D1D1D6;--red:#FF3B30;--glass:rgba(255,255,255,.88)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000000;--card:#1C1C1E;--fg:#FFFFFF;--mut:#98989F;--sep:#38383A;--glass:rgba(28,28,30,.88)}}
:root[data-theme=dark]{--bg:#000000;--card:#1C1C1E;--fg:#FFFFFF;--mut:#98989F;--sep:#38383A;--glass:rgba(28,28,30,.88)}
.yellow{--accent-text:#9A7A00}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .yellow{--accent-text:#FFD60A}}
:root[data-theme=dark] .yellow{--accent-text:#FFD60A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:16px}
body{max-width:430px;margin:0 auto;min-height:100vh;position:relative}
#screen{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 130px}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:6px}
.hdr h1{font-size:34px;font-weight:800;margin:0;letter-spacing:-.4px}
.bar{display:flex;align-items:center;gap:8px}
.back{background:none;border:0;color:var(--accent-text);font-size:17px;padding:8px 0;cursor:pointer}
.sec{font-size:22px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:6px}
.sec small{font-size:15px;color:var(--accent-text);font-weight:500}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:0 0 auto}
.pcard{width:240px;height:300px;border-radius:22px;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden}
.pcard .pt{font-size:26px;font-weight:800;line-height:1.1}
.pcard .ps{font-size:14px;opacity:.9}
.tile{width:130px;cursor:pointer}
.tile .circ{width:96px;height:96px;border-radius:22px;margin-bottom:6px}
.tile .tn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .to{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{border-radius:22px;height:150px;padding:16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;font-weight:700;font-size:18px}
.cat small{font-size:13px;font-weight:500;opacity:.9}
.card{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px}
.grp{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--sep);cursor:pointer;min-height:48px;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);font:inherit;text-align:left}
.row:last-child{border-bottom:0}
.row .lbl{flex:1;font-size:17px}
.row .val{color:var(--mut);font-size:15px}
.row .chev{color:var(--mut);font-size:20px}
.row.red .lbl{color:var(--red)}
.row.acc .lbl{color:var(--accent-text)}
.ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.logo{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex:0 0 44px}
.rk{width:26px;text-align:center;color:var(--mut);font-weight:600;font-size:15px}
.bn{flex:1;min-width:0}
.bn .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .m{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate{font-size:14px;font-weight:700;color:var(--accent-text);white-space:nowrap}
.tag{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--sep);color:var(--fg);white-space:nowrap;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:16px;padding:8px 14px;background:var(--card);color:var(--fg);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.yellow .chip.on{color:#000}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;height:40px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;color:var(--fg);font:inherit;font-size:17px;outline:none;min-width:0}
.fbtn{position:relative;border:0;background:var(--card);color:var(--accent-text);border-radius:12px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:700}
.seg{display:flex;background:var(--sep);border-radius:10px;padding:2px;gap:2px;margin:6px 0 12px}

let NAV=null;
let modalStack=[];
let modalCurrent=null;
let modalJob=0;
let modalTimer=0;
let closeTimer=0;
/* Hareket süreleri CSS değişkenlerinden okunur: zamanlayıcılar ile animasyonlar asla ayrışmaz. */
function motionMs(name,fallback){
 const raw=getComputedStyle(document.documentElement).getPropertyValue(name).trim();
 if(!raw)return fallback;
 const n=parseFloat(raw);
 if(isNaN(n))return fallback;
 return /ms$/.test(raw)?n:n*1000;
}
let modalBusy=false;
let sheetLabel='avr.';
let nextLabel=null;
function createModalPage(html,hasBack){
 const d=document.createElement('section');
 d.className='pg current';
 const tercih=sheetLabel==='Tercihler';
 d.innerHTML=`<div class="modal-nav${tercih?' tercih':''}"><button type="button" class="modal-nav-back" data-a="sheetback" aria-label="Geri" ${hasBack?'':'hidden'}><span aria-hidden="true">‹</span> Geri</button><span class="modal-nav-label">${esc(sheetLabel)}</span><button type="button" class="modal-nav-close" data-a="close" aria-label="Pencereyi kapat"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.4 5.4 18.6 18.6M18.6 5.4 5.4 18.6"/></svg></button></div><div class="pg-content">${html}</div>`;
 return d;
}
function clearModalJob(){
 clearTimeout(modalTimer);modalJob++;modalBusy=false;
 const sh=$('#sheet');
 if(modalCurrent){
  sh.replaceChildren(modalCurrent);
  modalCurrent.className='pg current';
  modalCurrent.style.removeProperty('--sy');
 }
 sh.style.overflowY='auto';
}
/* iOS gezinme geçişi: yeni sayfa sağdan girer, eski sayfa %30 sola kayıp kararır.
   Geri dönüşte alttaki sayfa aynı anda yerine kayar. Kaydırma konumu korunur. */
function swapModalPage(next,mode,restoreScroll){
 const sh=$('#sheet');
 const old=modalCurrent;
 const sy=sh.scrollTop;
 clearModalJob();
 const job=modalJob;
 modalCurrent=next;
 if(!old){sh.replaceChildren(next);return;}
 const t=motionMs('--d-page',528);
 const back=restoreScroll||0;
 if(!t){
  sh.replaceChildren(next);next.className='pg current';
  sh.scrollTop=mode==='pop'?back:0;
  return;
 }
 modalBusy=true;
 sh.style.overflowY='hidden';
 old.style.setProperty('--sy',sy+'px');
 old.className='pg current abs';
 next.className='pg current abs';
 if(mode==='pop'){
  next.style.setProperty('--sy',back+'px');
  next.classList.add('under-page');
  sh.prepend(next);
  old.classList.add('page-above');
 }else{
  next.style.setProperty('--sy','0px');
  next.classList.add('enter-right','page-above');
  sh.appendChild(next);
 }
 sh.scrollTop=0;
 void next.offsetWidth;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(job!==modalJob)return;
  if(mode==='pop'){next.classList.remove('under-page');old.classList.add('exit-right');}
  else{next.classList.remove('enter-right');old.classList.add('exit-left');}
 }));
 modalTimer=setTimeout(()=>{
  if(job!==modalJob)return;
  sh.replaceChildren(next);
  next.className='pg current';
  next.style.removeProperty('--sy');
  old.className='pg current';
  sh.style.overflowY='auto';
  sh.scrollTop=mode==='pop'?back:0;
  modalBusy=false;
 },Math.round(t)+50);
}
function openSheet(html,full=false){
 const w=$('#wrap'),sh=$('#sheet');
 const wasOpen=w.classList.contains('open')&&!w.classList.contains('closing');
 const mode=NAV||(wasOpen?'replace':'open');NAV=null;
 if(nextLabel){sheetLabel=nextLabel;nextLabel=null;}
 else if(!wasOpen){sheetLabel='avr.';}
 else if(mode==='push'){const temp=document.createElement('div');temp.innerHTML=html;sheetLabel=temp.querySelector('h2')?.textContent?.trim()||'Ayrıntılar';}
 clearTimeout(closeTimer);
 if(!wasOpen){
  clearModalJob();modalStack=[];
  modalCurrent=createModalPage(html,false);
  sh.replaceChildren(modalCurrent);
  sh.className=full?'full':'';
  sh.scrollTop=0;
  w.classList.remove('open','closing','profile-mode');
  w.style.visibility='visible';
  void sh.offsetWidth;
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('open')));
  document.body.classList.add('modal-visible');
  return;
 }
 if(mode==='replace'||document.documentElement.classList.contains('reduce')){
  const oldScroll=sh.scrollTop;
  clearModalJob();
  modalCurrent=createModalPage(html,modalStack.length>0);
  sh.replaceChildren(modalCurrent);
  sh.className=full?'full':'';
  sh.scrollTop=oldScroll;
  return;
 }
 if(mode==='pop'&&modalStack.length){backSheet();return;}
 if(modalBusy)return;
 modalStack.push({node:modalCurrent,full:sh.classList.contains('full'),scroll:sh.scrollTop});
 const next=createModalPage(html,true);
 sh.className=full?'full':'';
 swapModalPage(next,'push');
}
function backSheet(){
 if(modalBusy)return;
 if(!modalStack.length){closeSheet();return;}
 const prev=modalStack.pop();
 $('#sheet').className=prev.full?'full':'';
 swapModalPage(prev.node,'pop',prev.scroll||0);
}
function closeSheet(){
 if(touchNav?.active)return;
 const w=$('#wrap');
 if(!w.classList.contains('open')||w.classList.contains('closing'))return;
 clearModalJob();
 const sh=$('#sheet');
 w.classList.add('closing');
 const ms=motionMs('--d-sheet-out',516);
 const duration=ms?Math.round(ms)+50:0;
 clearTimeout(closeTimer);
 closeTimer=setTimeout(()=>{
  w.classList.remove('open','closing','profile-mode');
  w.style.visibility='';
  document.body.classList.remove('modal-visible');
  modalCurrent=null;modalStack=[];sheetLabel='avr.';
  sh.replaceChildren();sh.className='';sh.style.overflowY='auto';
 },duration);
}

/* ========== 7. VERİ: DIŞA / İÇE AKTARMA (isteğe bağlı şifre) ========== */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s);}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function keyFrom(pw,salt){
 const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptText(text,pw){
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const k=await keyFrom(pw,salt);
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(text)));
 return JSON.stringify({enc:1,s:b64(salt),i:b64(iv),d:b64(ct)});
}
async function decryptText(obj,pw){
 const k=await keyFrom(pw,unb64(obj.s));
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.i)},k,unb64(obj.d));
 return dec.decode(pt);
}
async function exportData(encrypted){
 const payload=JSON.stringify({app:'avr-rehber',v:1,date:new Date().toISOString(),data:S});
 let out=payload,name='avr-yedek';
 if(encrypted){
  const pw=window.prompt('Yedek için bir şifre girin. Bu şifreyi unutursanız yedek açılamaz.');
  if(!pw){toast('İptal edildi');return;}
  out=await encryptText(payload,pw);name+='-sifreli';
 }
 const blob=new Blob([out],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=name+'-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();
 S.lastBackup=Date.now();save();toast('Yedek kaydedildi');
 render();
}

const mainHistory=[];
let mainDirection=1;
let mainTransition=null;
function rememberMain(){
 const el=$('#screen');
 if(!el?.innerHTML)return;
 mainHistory.push({tab:S.tab,view:cloneObj(VIEW),html:el.innerHTML,scroll:window.scrollY});
 if(mainHistory.length>24)mainHistory.shift();
}
function goMainBack(instant=false){
 if(!mainHistory.length)return false;
 const prev=mainHistory.pop();
 S.tab=prev.tab;VIEW=cloneObj(prev.view);save();
 mainDirection=-1;ANIM_NEXT=!instant;
 render();window.scrollTo({top:prev.scroll||0,behavior:'instant'});
 return true;
}
function stopMainTransition(){
 if(!mainTransition)return;
 mainTransition.animations.forEach(a=>{try{a.cancel()}catch(_){}});
 mainTransition.ghost.remove();mainTransition=null;
 $('#screen').style.removeProperty('transform');
}
function mainSlideToNew(oldHTML,dir,oldScroll){
 stopMainTransition();
 if(S.reduce||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const screen=$('#screen'),rect=screen.getBoundingClientRect();
 const ghost=document.createElement('div');ghost.className='nav-ghost';
 ghost.style.left=rect.left+'px';ghost.style.width=rect.width+'px';
 const content=document.createElement('div');content.className='nav-ghost-content';content.innerHTML=oldHTML;
 content.style.transform=`translate3d(0,${-oldScroll}px,0)`;
 ghost.appendChild(content);document.body.appendChild(ghost);
 const duration=motionMs('--d-screen',384),ease='cubic-bezier(.32,.72,0,1)';
 const anims=[];
 if(dir>=0){
  ghost.style.zIndex='0';
  anims.push(ghost.animate([{transform:'translate3d(0,0,0)'},{transform:'translate3d(-30%,0,0)'}],{duration,easing:ease,fill:'forwards'}));
  anims.push(screen.animate([{transform:'translate3d(104%,0,0)'},{transform:'translate3d(0,0,0)'}],{duration,easing:ease,fill:'both'}));

function drawLogoCrop(){
 const c=$('#logoCanvas');if(!c)return;

 }
 const img=logoEditorImage,scale=Math.max(W/img.width,H/img.height)*logoZoom;
 const dw=img.width*scale,dh=img.height*scale;
 logoDX=Math.max((W-dw)/2,Math.min((dw-W)/2,logoDX));
 logoDY=Math.max((H-dh)/2,Math.min((dh-H)/2,logoDY));
 ctx.drawImage(img,(W-dw)/2+logoDX,(H-dh)/2+logoDY,dw,dh);
 ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W/2,H/2,W/2-2,0,Math.PI*2);ctx.stroke();

  modalBusy=false;
 }else if(g.kind==='modal-root'){
  const w=$('#wrap');w.classList.remove('gesture-root','gesture-settling');
  w.style.removeProperty('--gesture-x');w.style.removeProperty('--gesture-dim');
 }else{
  const el=$('#screen');el.classList.remove('main-gesturing','main-settling');el.style.removeProperty('--main-x');
  g.ghost?.remove();
 }
}
function finishTouchNav(g,commit){
 const target=commit?g.width+42:0;
 const root=g.kind==='modal-root'?'#wrap':g.kind==='modal-page'?'#sheet':'#screen';
 const host=$(root);host.classList.add('gesture-settling');
 if(g.kind==='main'){$('#screen').classList.remove('main-gesturing');$('#screen').classList.add('main-settling');g.ghost.classList.add('main-settling');}
 g.swipe=target;updateTouchNav(g);
 if(g.kind==='modal-page'&&commit){host.style.setProperty('--gesture-under','0px');}
 const ms=S.reduce||matchMedia('(prefers-reduced-motion: reduce)').matches?0:motionMs('--gesture-time',300);
 setTimeout(()=>{
  if(g.kind==='modal-page'){
   if(commit){
    const prev=modalStack.pop();modalCurrent=prev.node;
    $('#sheet').className=(prev.full?'full ':'')+'gesture-pages';
    $('#sheet').replaceChildren(modalCurrent);modalCurrent.className='pg current';
    modalCurrent.style.removeProperty('--sy');
    $('#sheet').scrollTop=prev.scroll||0;
   }else{
    g.under.remove();modalCurrent=g.top;
    $('#sheet').replaceChildren(modalCurrent);modalCurrent.className='pg current';
    modalCurrent.style.removeProperty('--sy');$('#sheet').scrollTop=g.scroll;
   }
   cleanupTouchNav(g);
  }else if(g.kind==='modal-root'){
   cleanupTouchNav(g);
   if(commit){
    const w=$('#wrap');w.classList.remove('open','closing','profile-mode');w.style.visibility='';
    $('#sheet').replaceChildren();$('#sheet').className='';
    modalCurrent=null;modalStack=[];sheetLabel='avr.';
    document.body.classList.remove('modal-visible');
   }
  }else{
   cleanupTouchNav(g);
   if(commit)goMainBack(true);
  }
 },ms+24);
}
document.addEventListener('touchstart',e=>{
 if(e.touches.length!==1||modalBusy)return;
 const t=e.touches[0],wrap=$('#wrap');
 const target=e.target;
 if(target.closest('input,textarea,select,canvas,[contenteditable],.hs,.chips,.sw-col,#tabbar'))return;
 const inside=wrap.classList.contains('open')&&!wrap.classList.contains('closing');
 const fromEdge=t.clientX<Math.min(112,window.innerWidth*.30);
 if(!fromEdge)return;
 const kind=inside?(modalStack.length?'modal-page':'modal-root'):(mainHistory.length?'main':null);
 if(!kind)return;
 touchNav={kind,startX:t.clientX,startY:t.clientY,lastX:t.clientX,lastTime:performance.now(),velocity:0,active:false};
},{passive:true});
document.addEventListener('touchmove',e=>{
 const g=touchNav;if(!g||e.touches.length!==1)return;
 const t=e.touches[0],dx=t.clientX-g.startX,dy=t.clientY-g.startY;
 if(!g.active){if(dx<10||Math.abs(dx)<Math.abs(dy)*1.25){if(Math.abs(dy)>12||dx< -12)touchNav=null;return;}beginTouchNav(g);}
 if(e.cancelable)e.preventDefault();
 const now=performance.now(),dt=now-g.lastTime;
 if(dt>0){g.velocity=(t.clientX-g.lastX)/dt;g.lastX=t.clientX;g.lastTime=now;}
 g.swipe=Math.max(0,dx);updateTouchNav(g);
},{passive:false});
document.addEventListener('touchend',e=>{
 const g=touchNav;touchNav=null;
 if(!g||!g.active)return;
 const commit=g.swipe>g.width*.34||(g.swipe>55&&g.velocity>.55);
 finishTouchNav(g,commit);
},{passive:true});
document.addEventListener('touchcancel',()=>{
 const g=touchNav;touchNav=null;if(g?.active)finishTouchNav(g,false);
},{passive:true});
/* Alt sekme üzerinde sürükleyip seçmek */
let tabGesture=null;
document.querySelector('#tabbar').addEventListener('touchstart',e=>{
 const t=e.touches[0];if(t)tabGesture={x:t.clientX,y:t.clientY};
},{passive:true});
document.querySelector('#tabbar').addEventListener('touchend',e=>{
 if(!tabGesture)return;
 const t=e.changedTouches[0],g=tabGesture;tabGesture=null;
 if(Math.abs(t.clientX-g.x)<22||Math.abs(t.clientY-g.y)>Math.abs(t.clientX-g.x))return;
 const b=[...document.querySelectorAll('#tabbar button')].find(b=>{const r=b.getBoundingClientRect();return t.clientX>=r.left&&t.clientX<=r.right;});
 if(b&&b.dataset.t!==S.tab)b.click();
},{passive:true});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#wrap').classList.contains('open')){e.preventDefault();backSheet();}
});
window.addEventListener('resize',()=>requestAnimationFrame(updateIndicator));
function validateState(){
 if(!S||typeof S!=='object')S=cloneObj(DEF);
 for(const [k,v] of Object.entries(DEF))if(S[k]===undefined||S[k]===null)S[k]=cloneObj(v);
 const tabs=DEF.tabs;
 S.tabs=Array.isArray(S.tabs)?[...new Set(S.tabs.filter(k=>tabs.includes(k)))]:tabs.slice();
 tabs.forEach(k=>{if(!S.tabs.includes(k))S.tabs.push(k);});
 if(!tabs.includes(S.tab))S.tab='home';
 if(!Object.hasOwn(LCOL,S.accent))S.accent=DEF.accent;
 if(!['auto','light','dark'].includes(S.theme))S.theme='auto';
 if(typeof S.profile!=='object'||!S.profile)S.profile=cloneObj(DEF.profile);
 if(!S.filters||typeof S.filters!=='object')S.filters=cloneObj(DEF.filters);
 for(const [k,v] of Object.entries(DEF.filters))if(S.filters[k]===undefined)S.filters[k]=cloneObj(v);
 for(const k of ['recent','favs','lists','hideB','hideC','sellers','favCats','hist'])if(!Array.isArray(S[k]))S[k]=cloneObj(DEF[k]);
 for(const k of ['notes','myR','pnotes','homeSec','brandLogos'])if(!S[k]||typeof S[k]!=='object')S[k]=cloneObj(DEF[k]);
 if(!Array.isArray(S.filters.clist))S.filters.clist=[];
 if(!SORTS.some(x=>x[0]===S.filters.sort))S.filters.sort='quality';
 S.glass=S.glass!==false;
}
/* ========== 10. BAŞLAT ========== */
validateState();
render();
$('#screen').addEventListener('animationend',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('anim');});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>applyTheme());

/* ===== Desktop adaptation and native-feeling keyboard navigation ===== */
function renderDesktopChrome(){
 const nav=document.getElementById('desktopNav');if(!nav)return;
 const isSame=nav.children.length===S.tabs.length&&[...nav.children].every((b,i)=>b.dataset.t===S.tabs[i]);
 if(!isSame){
  nav.innerHTML=S.tabs.map((k,i)=>`<button type="button" class="desktop-side-button" data-a="tab" data-t="${k}" aria-label="${esc(TABL[k])}"><span class="desktop-side-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${TABI[k]}"/></svg></span><span>${esc(TABL[k])}</span><kbd>⌘${i+1}</kbd></button>`).join('');
 }
 [...nav.children].forEach((b,i)=>{const on=b.dataset.t===S.tab;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false');const kb=b.querySelector('kbd');if(kb)kb.textContent='⌘'+(i+1);});
 const title=S.tab==='brands'&&VIEW.cat?(CM[VIEW.cat]?.n||'Markalar'):S.tab==='lists'&&VIEW.list?(S.lists.find(l=>l.id===VIEW.list)?.name||'Listelerim'):TABL[S.tab];
 const label=document.getElementById('desktopActiveName');if(label)label.textContent=title;
 const nick=[S.profile?.ad,S.profile?.soyad].filter(Boolean).join(' ').trim()||'Profilim';
 const name=document.getElementById('desktopUserName');if(name)name.textContent=nick;
 const photo=S.profile?.foto;
 const avatarHtml=photo?`<img src="${esc(photo)}" alt="">`:'●';
 const mini=document.querySelector('.desktop-toolbar-avatar');if(mini)mini.innerHTML=avatarHtml;
 const side=document.querySelector('.desktop-side-avatar');if(side)side.innerHTML=avatarHtml;
}
function desktopBack(){
 const wrap=document.getElementById('wrap');
 if(wrap.classList.contains('open')){if(!modalBusy)backSheet();return;}
 if(mainHistory.length){goMainBack();return;}
 if(VIEW.cat||VIEW.list){const b=document.querySelector('#screen [data-a="back"]');b?.click();}
}
document.addEventListener('keydown',event=>{
 const mac=event.metaKey||event.ctrlKey;
 if(!mac||event.altKey)return;
 const key=event.key.toLowerCase();
 if(key==='k'||key==='/'){
  event.preventDefault();(document.querySelector('#desktopNav [data-t="search"]')||document.querySelector('#tabbar [data-t="search"]'))?.click();
  setTimeout(()=>document.getElementById('q')?.focus({preventScroll:true}),35);
 }else if(key===','){
  event.preventDefault();if(!document.getElementById('wrap').classList.contains('open')){nextLabel='Ayarlar';NAV='push';openSettings();}
 }else if(/^[1-4]$/.test(key)&&!event.shiftKey){
  event.preventDefault();const k=S.tabs[Number(key)-1];(document.querySelector(`#desktopNav [data-t="${k}"]`)||document.querySelector(`#tabbar [data-t="${k}"]`))?.click();
 }else if(key==='['){event.preventDefault();desktopBack();}
});
/* Two-finger trackpad back. Keep normal scrolling in horizontal carousels intact. */
let desktopWheelX=0,desktopWheelAt=0,desktopWheelLock=0;
document.addEventListener('wheel',event=>{
 if(window.innerWidth<700||event.ctrlKey||event.shiftKey||Math.abs(event.deltaX)<Math.abs(event.deltaY)*1.3)return;
 if(event.target.closest('.hs,.chips,.sw-col,#desktopSidebar,input,textarea,canvas,[contenteditable],.logo-editor-preview'))return;
 if(event.deltaX>=0)return; // Natural trackpad rightward gesture
 const inside=document.getElementById('wrap').classList.contains('open');
 if(!inside&&!mainHistory.length&&!VIEW.cat&&!VIEW.list)return;
 if(event.cancelable)event.preventDefault();
 const now=performance.now();if(now<desktopWheelLock)return;
 if(now-desktopWheelAt>420)desktopWheelX=0;
 desktopWheelAt=now;desktopWheelX+=Math.abs(event.deltaX);
 if(desktopWheelX>125){desktopWheelX=0;desktopWheelLock=now+720;desktopBack();}
},{passive:false});

</script>
